<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio — Carla Ducrocq</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow-x:hidden}
#loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .55s ease,visibility .55s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.logo{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,58px);letter-spacing:.08em;font-weight:400;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.portfolio{opacity:0;transition:opacity .55s ease}
.portfolio.ready{opacity:1}
iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<div id="loader"><div class="logo">CARLA DUCROCQ</div></div>
<main id="portfolio" class="portfolio">
  <iframe src="portfolio-1.pdf#view=FitH&toolbar=0&navpanes=0" title="Portfolio Carla Ducrocq - partie 1"></iframe>
  <iframe src="portfolio-2.pdf#view=FitH&toolbar=0&navpanes=0" title="Portfolio Carla Ducrocq - partie 2" loading="lazy"></iframe>
</main>
<script>
const loader=document.getElementById('loader'),portfolio=document.getElementById('portfolio'),first=document.querySelector('iframe');
function reveal(){portfolio.classList.add('ready');loader.classList.add('hide')}
first.addEventListener('load',()=>setTimeout(reveal,350));
setTimeout(reveal,3500);
</script>
</body>
</html>
