<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio — Carla Ducrocq</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .55s ease}
#loader{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .55s ease,visibility .55s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.logo{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,58px);letter-spacing:.08em;font-weight:400;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div id="loader"><div class="logo">CARLA DUCROCQ</div></div>
<iframe id="portfolio" src="portfolio.pdf#view=FitH&toolbar=1" title="Portfolio de Carla Ducrocq"></iframe>
<script>
const frame=document.getElementById('portfolio');
const loader=document.getElementById('loader');
function reveal(){frame.style.opacity='1';loader.classList.add('hide')}
frame.addEventListener('load',()=>setTimeout(reveal,350));
setTimeout(reveal,3500);
</script>
</body>
</html>
